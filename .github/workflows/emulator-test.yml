name: Uji Emulator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        env:
          CATALOG_KEY: ${{ secrets.CATALOG_KEY }}
      - name: Verifikasi sidik jari sertifikat APK
        run: |
          FP=$(keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: //')
          echo "Sidik jari APK: $FP"
          test "$FP" = "DB:C6:EB:78:66:F6:E2:64:3A:54:0D:5A:CF:30:D8:63:A7:6A:8E:DC:0B:CE:EE:12:8E:48:F4:5A:A1:2D:00:2A"
      - name: Uji putar di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell 'am start -n com.renkai.app/.MainActivity'
            sleep 35
            adb exec-out screencap -p > home.png
            adb shell 'am force-stop com.renkai.app'
            sleep 2
            adb shell 'am start -n com.renkai.app/.MainActivity --es rk_title mobile-suit-gundam-age --ei rk_ep 1'
            sleep 50
            adb exec-out screencap -p > play1.png
            sleep 12
            adb exec-out screencap -p > play2.png
            adb shell 'dumpsys activity activities | grep -A2 mResumedActivity' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renkai-emulator-shots
          path: |
            home.png
            play1.png
            play2.png
      - name: Unggah tangkapan layar ke Release ci-shots
        if: always()
        run: |
          gh release create ci-shots home.png play1.png play2.png \
            --prerelease --title "Tangkapan layar uji emulator" \
            --notes "Bukti uji mandiri di emulator CI." \
          || gh release upload ci-shots home.png play1.png play2.png --clobber
        env:
          GH_TOKEN: ${{ github.token }}
