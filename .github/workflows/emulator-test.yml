name: Uji Emulator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        env:
          CATALOG_KEY: ${{ secrets.CATALOG_KEY }}
      - name: Uji putar di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell 'am start -n com.renkai.app/.MainActivity'
            sleep 35
            adb exec-out screencap -p > home.png
            adb shell 'am force-stop com.renkai.app'
            sleep 2
            adb shell 'am start -n com.renkai.app/.MainActivity --es rk_title mobile-suit-gundam-age --ei rk_ep 1'
            sleep 50
            adb exec-out screencap -p > play1.png
            sleep 12
            adb exec-out screencap -p > play2.png
            adb shell 'dumpsys activity activities | grep -A2 mResumedActivity' || true
      - name: Verifikasi sidik jari sertifikat APK (apksigner; keytool tak membaca tanda tangan APK v2)
        if: always()
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256 digest" | sed 's/.*digest: //' | tr -d ' ' | tr 'A-F' 'a-f')
          echo "Sidik jari APK: $FP" | tee fp.txt
          test "$FP" = "dbc6eb7866f6e2643a540d5acf30d863a76a8edc0bceee128e48f45aa12d002a"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renkai-emulator-shots
          path: |
            home.png
            play1.png
            play2.png
            fp.txt
