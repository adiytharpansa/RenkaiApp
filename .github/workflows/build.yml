name: Build Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        env:
          CATALOG_KEY: ${{ secrets.CATALOG_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Renkai-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Terbitkan APK ke Release v1.0 (khusus dispatch manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release create v1.0 app/build/outputs/apk/release/app-release.apk \
            --title "Renkai v1.0" \
            --notes "Renkai v1.0 — aplikasi asli terhubung katalog: beranda/cari/detail/koleksi, pemutar HLS multi-pintu + subtitle Inggris & Indonesia." \
          || gh release upload v1.0 app/build/outputs/apk/release/app-release.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
